[package]
name = "gnotes-gtk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native GNOME client for Gnotes"

[[bin]]
name = "gnotes"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
anyhow = "1"
async-channel = "2.5"
base64 = "0.23.1"
# Emoji by GitHub's names, for ":taco:" and the emoji picker in notes.
emojis = "0.9"
futures-util = "0.3.34"
# Records voice memos from the microphone.
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
loro = "1.16"
# Finds the Markdown structure the editor styles.
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
gnotes-server = { path = "../server" }
tempfile = "3.27.0"
