<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f3f5"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8e45c"/>
      <stop offset=".5" stop-color="#f6d32d"/>
      <stop offset=".5" stop-color="#e5a50a"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
    <clipPath id="face"><rect x="18" y="14" width="92" height="98" rx="12"/></clipPath>
  </defs>

  <!-- Slab: the darker base shows as a thick bottom edge, Adwaita style. -->
  <rect x="18" y="20" width="92" height="100" rx="12" fill="#c0bfbc"/>
  <rect x="18" y="20" width="92" height="98" rx="12" fill="#deddda"/>

  <!-- Page face with a blue header band. -->
  <rect x="18" y="14" width="92" height="98" rx="12" fill="url(#page)"/>
  <g clip-path="url(#face)">
    <rect x="18" y="14" width="92" height="24" fill="url(#band)"/>
    <rect x="18" y="36" width="92" height="3" fill="#1c71d8"/>
  </g>

  <!-- Binder rings. -->
  <g fill="#1a5fb4">
    <rect x="37" y="22" width="6" height="8" rx="3"/>
    <rect x="61" y="22" width="6" height="8" rx="3"/>
    <rect x="85" y="22" width="6" height="8" rx="3"/>
  </g>

  <!-- A checked task, then lines of text. -->
  <rect x="30" y="50" width="14" height="14" rx="4" fill="#3584e4"/>
  <path d="M33.5 57.2l2.6 2.6 4.6-5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="50" y="54" width="46" height="6" rx="3" fill="#9a9996"/>
  <rect x="30" y="72" width="66" height="6" rx="3" fill="#c0bfbc"/>
  <rect x="30" y="86" width="50" height="6" rx="3" fill="#c0bfbc"/>

  <!-- Pencil resting across the corner. -->
  <g transform="translate(0 3) rotate(45 94 94)" fill="#000" opacity=".12">
    <rect x="88" y="52" width="12" height="50" rx="3"/>
    <path d="M88 101h12l-6 15z"/>
  </g>
  <g transform="rotate(45 94 94)">
    <rect x="88" y="60" width="12" height="42" fill="url(#pencil)"/>
    <rect x="88" y="56" width="12" height="7" rx="2" fill="#c0bfbc"/>
    <rect x="88" y="52" width="12" height="6" rx="3" fill="#ed333b"/>
    <path d="M88 102h12l-6 14z" fill="#f6d5b2"/>
    <path d="M91.9 111.1h4.2L94 116z" fill="#3d3846"/>
  </g>
</svg>
