name: Build and Push Docker Image

# Tags only: a release is `git tag vX.Y.Z && git push --tags`. Building every push
# to main as well doubled the queue on the one-job runner and delayed releases.
on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: git.erisdor.com
  # Hardcoded on purpose — deriving from github.repository lets a repo rename
  # silently move the published image out from under the Deployment.
  IMAGE_NAME: justin/gnotes

jobs:
  test:
    runs-on: ubuntu-latest # plain node:22-bookworm — install everything you use
    steps:
      - uses: actions/checkout@v4
      # Server tests need a Rust toolchain the runner doesn't have; they run locally
      # (cargo test), and the image build below still fails on any compile error.
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck web
        run: npm run check
        working-directory: web
      - name: Build web
        run: npm run build
        working-directory: web

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner image has no docker CLI; only the daemon socket is mounted in.
      - name: Install the docker CLI
        run: |
          set -eu
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.7.1.tgz \
            | tar xz -C /usr/local/bin --strip-components=1 docker/docker
      # The daemon's disk is a 16Gi emptyDir shared with every repo's jobs, and filling it evicts
      # the runner (2026-10-02). Clear what earlier jobs left (dangling images, old builders' state
      # volumes) and trim the build cache before building, so a cold build always has room. The
      # runner takes one job at a time, so nothing in use is touched.
      - name: Make room
        run: |
          docker image prune --force
          docker volume prune --all --force
          docker builder prune --force --max-used-space 6GB
          docker system df
      # The `docker` driver builds in the runner's own daemon, whose layer cache lasts between jobs
      # (until the runner pod restarts), so unchanged layers like the Rust dependencies are reused.
      # The default driver made a fresh builder per job and cached nothing.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: justin
          # write:package repo Actions secret; GITHUB_TOKEN cannot push packages here.
          password: ${{ secrets.REGISTRY_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # No cache-from/cache-to: type=gha is GitHub-hosted and type=registry
      # fails the whole build on a cache miss. The daemon's own cache (above) does the job.
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Tells Flux the image is out (Receiver `ci` in kubernetes-homelab), so it scans now; the
      # second call, once the image bump is committed, makes it fetch and apply that commit.
      # Best-effort: if it misses, Flux's own timers still roll the release out a minute or two later.
      - name: Tell Flux
        env:
          HOOK: ${{ secrets.FLUX_RECEIVER_URL }}
        run: |
          [ -n "$HOOK" ] || exit 0
          curl -fsS -m 10 -X POST "$HOOK" -o /dev/null || echo "Flux didn't answer; it will catch up on its own"
          sleep 20
          curl -fsS -m 10 -X POST "$HOOK" -o /dev/null || echo "Flux didn't answer; it will catch up on its own"
      # And again after, so what this build added stays bounded too.
      - name: Trim the build cache
        if: always()
        run: docker builder prune --force --max-used-space 6GB
