[package]
name = "gnotes-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.6.0"
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
loro = "1.16"
mime = "0.3"
# Calls the external speech-to-text endpoint.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = "0.3.55"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "multipart"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
